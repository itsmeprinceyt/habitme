name: habit_me
description: "HabitMe - Your Personal Habit Tracker"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  sqflite: ^2.4.5
  path: ^1.9.1
  path_provider: ^2.1.6
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  table_calendar: ^3.3.0
  file_picker: ^13.3.2
  share_plus: ^13.3.1
  csv: ^8.0.0
  intl: ^0.20.3
  uuid: ^4.6.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/habitme_logo.png
    - assets/habitme_logo_rounded.png
    - assets/habitme_logo_svg.svg

# App launcher icon configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/habitme_logo_rounded.png"
  min_sdk_android: 21
